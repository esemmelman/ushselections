<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163d38">
  <title>High Holiday Ushers · 2026</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">HIGH HOLIDAYS · 2026</p>
      <h1>Our usher volunteers</h1>
      <p class="intro">Thank you for helping welcome our community.</p>
    </header>
    <div class="toolbar">
      <p id="status" role="status">Loading volunteers…</p>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div class="board" id="board" aria-label="Volunteers by service" aria-busy="true"></div>
    <footer>Names appear under each selected service. Updates automatically every minute.</footer>
  </main>
</body>
</html>
